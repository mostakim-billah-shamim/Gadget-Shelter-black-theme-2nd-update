{% if messages %}
<!-- CSS Styles -->
<style>
    .toast-messages-wrapper {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 400px;
        width: calc(100% - 48px);
        pointer-events: none;
    }

    .aesthetic-toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        color: #F8FAFC;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 0 12px rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .aesthetic-toast.toast-success { border-left: 4px solid #10B981; }
    .aesthetic-toast.toast-danger { border-left: 4px solid #EF4444; }
    .aesthetic-toast.toast-warning { border-left: 4px solid #F59E0B; }
    .aesthetic-toast.toast-info { border-left: 4px solid #3B82F6; }

    .toast-content { display: flex; align-items: center; gap: 12px; }
    
    .toast-icon {
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 700;
        flex-shrink: 0;
    }

    .toast-success .toast-icon { background: rgba(16, 185, 129, 0.2); color: #10B981; }
    .toast-danger .toast-icon { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
    .toast-warning .toast-icon { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
    .toast-info .toast-icon { background: rgba(59, 130, 246, 0.2); color: #3B82F6; }

    .toast-close-btn {
        background: transparent;
        border: none;
        color: #94A3B8;
        font-size: 18px;
        cursor: pointer;
        margin-left: 12px;
        line-height: 1;
        transition: color 0.2s;
    }
    .toast-close-btn:hover { color: #FFFFFF; }

    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(50px) scale(0.95); }
        to { opacity: 1; transform: translateX(0) scale(1); }
    }
</style>

<!-- HTML Structure -->
<div class="toast-messages-wrapper">
    {% for message in messages %}
    <div class="aesthetic-toast toast-{{ message.tags }}" role="alert">
        <div class="toast-content">
            <span class="toast-icon">
                {% if message.tags == 'danger' %}✕
                {% elif message.tags == 'success' %}✓
                {% elif message.tags == 'warning' %}⚠️
                {% else %}ℹ{% endif %}
            </span>
            <span class="toast-text">{{ message }}</span>
        </div>
        <button type="button" class="toast-close-btn" onclick="this.parentElement.remove();">&times;</button>
    </div>
    {% endfor %}
</div>

<!-- JavaScript for Auto Dismiss -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toasts = document.querySelectorAll('.aesthetic-toast');
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.style.transition = 'all 0.4s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(50px)';
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        });
    });
</script>
{% endif %}
