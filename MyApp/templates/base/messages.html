{% if messages %}
<!-- CSS Styles -->
<style>
    .toast-messages-wrapper {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 420px;
        width: calc(100% - 48px);
        pointer-events: none;
    }

    .aesthetic-toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-radius: 16px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        color: #F8FAFC;
        font-size: 14px;
        font-weight: 500;
        box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.2);
        animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        position: relative;
        overflow: hidden;
    }

    /* Dynamic Backgrounds & Borders based on Message Type */
    .aesthetic-toast.toast-success {
        background: linear-gradient(135deg, rgba(6, 78, 59, 0.85), rgba(4, 47, 46, 0.9));
        border: 1px solid rgba(16, 185, 129, 0.35);
        box-shadow: 0 15px 35px -5px rgba(6, 78, 59, 0.4), 0 0 15px rgba(16, 185, 129, 0.15);
    }

    .aesthetic-toast.toast-danger, .aesthetic-toast.toast-error {
        background: linear-gradient(135deg, rgba(127, 29, 29, 0.85), rgba(69, 10, 10, 0.9));
        border: 1px solid rgba(239, 68, 68, 0.35);
        box-shadow: 0 15px 35px -5px rgba(127, 29, 29, 0.4), 0 0 15px rgba(239, 68, 68, 0.15);
    }

    .aesthetic-toast.toast-warning {
        background: linear-gradient(135deg, rgba(120, 53, 15, 0.85), rgba(69, 26, 3, 0.9));
        border: 1px solid rgba(245, 158, 11, 0.35);
        box-shadow: 0 15px 35px -5px rgba(120, 53, 15, 0.4), 0 0 15px rgba(245, 158, 11, 0.15);
    }

    .aesthetic-toast.toast-info {
        background: linear-gradient(135deg, rgba(30, 58, 138, 0.85), rgba(23, 37, 84, 0.9));
        border: 1px solid rgba(59, 130, 246, 0.35);
        box-shadow: 0 15px 35px -5px rgba(30, 58, 138, 0.4), 0 0 15px rgba(59, 130, 246, 0.15);
    }

    .toast-content { 
        display: flex; 
        align-items: center; 
        gap: 14px; 
    }
    
    .toast-icon {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 15px;
        font-weight: 700;
        flex-shrink: 0;
        box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.2);
    }

    .toast-success .toast-icon { background: rgba(16, 185, 129, 0.25); color: #34D399; }
    .aesthetic-toast.toast-danger .toast-icon, .aesthetic-toast.toast-error .toast-icon { background: rgba(239, 68, 68, 0.25); color: #F87171; }
    .toast-warning .toast-icon { background: rgba(245, 158, 11, 0.25); color: #FBBF24; }
    .toast-info .toast-icon { background: rgba(59, 130, 246, 0.25); color: #60A5FA; }

    .toast-text {
        line-height: 1.45;
        color: #F1F5F9;
        font-size: 0.9rem;
    }

    /* Perfectly centered close button styling */
    .toast-close-btn {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #CBD5E1;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
        margin-left: 14px;
        flex-shrink: 0;
        line-height: 1;
        transition: all 0.2s ease;
    }
    .toast-close-btn:hover { 
        background: rgba(255, 255, 255, 0.15);
        color: #FFFFFF; 
        transform: scale(1.1);
    }

    @keyframes slideInRight {
        from { opacity: 0; transform: translateX(60px) scale(0.9); }
        to { opacity: 1; transform: translateX(0) scale(1); }
    }
</style>

<!-- HTML Structure -->
<div class="toast-messages-wrapper">
    {% for message in messages %}
    <div class="aesthetic-toast toast-{{ message.tags }}" role="alert">
        <div class="toast-content">
            <span class="toast-icon">
                {% if message.tags == 'danger' or message.tags == 'error' %}✕
                {% elif message.tags == 'success' %}✓
                {% elif message.tags == 'warning' %}!
                {% else %}i{% endif %}
            </span>
            <span class="toast-text">{{ message }}</span>
        </div>
        <button type="button" class="toast-close-btn" onclick="this.closest('.aesthetic-toast').remove();">&times;</button>
    </div>
    {% endfor %}
</div>

<!-- JavaScript for Auto Dismiss -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toasts = document.querySelectorAll('.aesthetic-toast');
        toasts.forEach(toast => {
            setTimeout(() => {
                toast.style.transition = 'all 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(60px) scale(0.95)';
                setTimeout(() => toast.remove(), 400);
            }, 4500);
        });
    });
</script>
{% endif %}
